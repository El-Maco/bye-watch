name: Build, test, and deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: i686-unknown-linux-gnu
          components: clippy

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libssl-dev gcc-multilib

      - name: Test
        run: export CARGO_HOME="/home/$(whoami)/.local/share/.cargo" && cargo test --workspace

      - name: Clippy
        run: export CARGO_HOME="/home/$(whoami)/.local/share/.cargo" && cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: export CARGO_HOME="/home/$(whoami)/.local/share/.cargo" && cargo build --release --target i686-unknown-linux-gnu -p bye-watch-bot

      - name: Deploy
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          TARGET_PASS: ${{ secrets.TARGET_PASS }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          ssh $TARGET_USER@$TARGET_HOST "echo $TARGET_PASS | sudo -S systemctl stop bye-watch.service"
          ssh $TARGET_USER@$TARGET_HOST "cd $TARGET_PATH && mv bot bot_$(date +%Y-%m-%d_%H%M) || true"
          scp target/i686-unknown-linux-gnu/release/bot $TARGET_USER@$TARGET_HOST:$TARGET_PATH
          ssh $TARGET_USER@$TARGET_HOST "echo $TARGET_PASS | sudo -S systemctl start bye-watch.service"
